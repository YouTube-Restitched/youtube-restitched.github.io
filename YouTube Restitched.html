<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Restitched Setup</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .switch {
          position: relative;
          display: inline-block;
          width: 50px;
          height: 26px;
          vertical-align: middle;
          margin-left: 10px;
        }

        .switch input {
          opacity: 0;
          width: 0;
          height: 0;
          vertical-align: middle;
        }

        .slider {
          position: absolute;
          cursor: pointer;
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: #ccc;
          transition: 0.4s;
          border-radius: 34px;
        }

        .slider:before {
          position: absolute;
          content: "";
          height: 18px;
          width: 18px;
          left: 4px;
          bottom: 4px;
          background-color: white;
          transition: 0.4s;
          border-radius: 50%;
        }

        input:checked + .slider {
          background-color: #ff0000;
        }

        input:checked + .slider:before {
          transform: translateX(24px);
        }
    </style>
</head>
<body>

    <h1>YouTube Restitched setup</h1>

    <h4>Restore dislike counter
        <label class="switch">
          <input type="checkbox" id="dislike-toggle" checked>
          <span class="slider"></span>
        </label>
    </h4>

    <h4>Show ad markers
        <label class="switch">
          <input type="checkbox" id="ads-toggle" checked>
          <span class="slider"></span>
        </label>
    </h4>

</body>
</html>
